# EC2 운영용 HTTPS 설정 (Let's Encrypt 인증서는 호스트 /etc/letsencrypt 를 마운트해서 사용)
# http 와 도메인(www 없음)은 모두 https://www 로 보냅니다.
server {
    listen 80;
    server_name keungkeung.com www.keungkeung.com;
    return 301 https://www.keungkeung.com$request_uri;
}
server {
    listen 443 ssl;
    server_name keungkeung.com;
    ssl_certificate     /etc/letsencrypt/live/keungkeung.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keungkeung.com/privkey.pem;
    return 301 https://www.keungkeung.com$request_uri;
}
server {
    listen 443 ssl;
    server_name www.keungkeung.com;
    ssl_certificate     /etc/letsencrypt/live/keungkeung.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keungkeung.com/privkey.pem;

    client_max_body_size 10m;
    root /usr/share/nginx/html;
    index index.html;

    # 백엔드로 넘기는 경로: API, SNS 로그인 시작·콜백
    location ~ ^/(api|oauth2|login/oauth2)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # 업로드한 사진
    location /uploads/ {
        alias /data/uploads/;
    }
    # React Router: 새로고침해도 index.html 로
    location / {
        try_files $uri /index.html;
    }
}
