spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # 저장소 루트의 .env 를 읽습니다(backend 폴더에서 실행 기준). 파일이 없으면 건너뜁니다.
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gaebalhagae}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # 프로토타입 기간에는 엔티티 기준으로 테이블을 자동 생성·수정합니다.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080
  # Nginx 뒤에서 https 주소를 올바르게 만들기 위해 X-Forwarded-* 헤더를 사용합니다.
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# 네이버 블로그 검색 (NAVER API HUB 키)
naver:
  search:
    base-url: https://naverapihub.apigw.ntruss.com
    client-id: ${NAVER_SEARCH_ID:}
    client-secret: ${NAVER_SEARCH_SECRET:}

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true

---
# 노트북 수집용: DB 없이 실행하고 결과는 JSON 파일로 저장합니다.
spring:
  config:
    activate:
      on-profile: collect
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
collect:
  store: json
  dir: data/blog

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
