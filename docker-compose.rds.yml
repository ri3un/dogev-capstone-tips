# 배포용(EC2 + RDS): DB는 RDS(MySQL)를 쓰고, EC2에서는 Nginx + Spring Boot만 띄웁니다.
#   cp .env.example .env   # DB_HOST 에 RDS 엔드포인트 등 값 채우기 (커밋 금지)
#   .env 에 COMPOSE_FILE=docker-compose.rds.yml 을 넣으면 `docker compose` 만 쳐도 이 파일을 씁니다.
#   docker compose up -d --build
# t3.micro(1GB) 기준으로 힙을 384m로 제한합니다. (swap 2GB 함께 사용)
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      UPLOAD_DIR: /data/uploads
      JAVA_TOOL_OPTIONS: "-Xmx384m -XX:MaxMetaspaceSize=160m -Djava.awt.headless=true"
      TZ: Asia/Seoul
    volumes:
      - uploads:/data/uploads
      # 자동 수집 상태·이력(collect-state.json, collect-log.jsonl)을 재빌드 후에도 유지
      - collect-data:/app/data

  nginx:
    build:
      context: ./frontend
      args:
        VITE_NCP_MAP_KEY_ID: ${VITE_NCP_MAP_KEY_ID}
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/data/uploads:ro
    depends_on: [backend]

volumes:
  uploads:
  collect-data:
