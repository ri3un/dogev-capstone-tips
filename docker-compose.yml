# 배포용: EC2 한 대에서 Nginx + Spring Boot + MySQL 을 함께 띄웁니다.
#   cp .env.example .env   # 값 채우기
#   docker compose up -d --build
# 8080·3306은 외부에 열지 않고 Nginx(80/443)만 엽니다.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gaebalhagae
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xmx512m -Djava.awt.headless=true"
      # 반려견 사진 저장 위치 (Nginx 가 같은 볼륨의 /uploads 를 제공)
      UPLOAD_DIR: /data/uploads
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads

  nginx:
    build:
      context: ./frontend
      args:
        VITE_NCP_MAP_KEY_ID: ${VITE_NCP_MAP_KEY_ID}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/data/uploads:ro
    depends_on:
      - backend

volumes:
  mysql-data:
  uploads:
